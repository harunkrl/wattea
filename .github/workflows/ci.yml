name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # rusqlite "bundled" → compiles SQLite itself, no system libsqlite3 needed.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt + clippy + test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt clippy
          rustup override set stable

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo clippy (all targets, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all
        env:
          # Tests do not read /proc/stat or /sys (all in-memory/bench); still,
          # pin a fixed TZ for determinism.
          TZ: UTC

  build-release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-
      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup override set stable
      - name: cargo build --release
        run: cargo build --release --all
      - name: Smoke-test binaries exist
        run: |
          test -x target/release/wattea
          test -x target/release/wattea-daemon
