[package]
name = "wattea"
version = "0.1.0"
edition = "2024"
description = "Wattea — terminal battery consumption tracker"
license = "MIT"

[lib]
name = "wattea"
path = "src/lib.rs"

[[bin]]
name = "wattea"
path = "src/bin/wattea.rs"

[[bin]]
name = "wattea-daemon"
path = "src/bin/wattea-daemon.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
signal-hook = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
