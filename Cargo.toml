[package]
name = "wattea"
version = "0.1.0"
edition = "2024"
description = "Wattea — terminal battery consumption tracker"
license = "MIT"

[[bin]]
name = "wattea"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
